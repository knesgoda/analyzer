name: Build England Layer 1 package

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out extraction branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Inspect official ONS IPN source
        run: python scripts/inspect_ipn_source.py

      - name: Install coordinate conversion dependency
        run: python -m pip install --disable-pip-version-check pyproj==3.7.1

      - name: Build and validate package
        run: python scripts/run_england_layer1.py

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: england-layer1-package
          path: |
            generated/england-layer1/England_BelongWhere_Layer1_Package_v1.2.0.json
            generated/england-layer1/England_BelongWhere_Layer1_Package_v1.2.0_QA.md
            generated/england-layer1/England_BelongWhere_Layer1_Package_v1.2.0_SHA256.txt
            generated/england-layer1/England_BelongWhere_Layer1_Package_v1.2.0.zip
            generated/england-layer1/England_BelongWhere_Layer1_Summary.json
          if-no-files-found: error
          retention-days: 7

      - name: Commit small QA outputs to extraction branch
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            generated/england-layer1/England_BelongWhere_Layer1_Package_v1.2.0_QA.md \
            generated/england-layer1/England_BelongWhere_Layer1_Package_v1.2.0_SHA256.txt \
            generated/england-layer1/England_BelongWhere_Layer1_Summary.json
          if git diff --cached --quiet; then
            echo "QA outputs unchanged"
          else
            git commit -m "Record England Layer 1 QA [skip ci]"
            git push origin HEAD:${{ github.head_ref }}
          fi
